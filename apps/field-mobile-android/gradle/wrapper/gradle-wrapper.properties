#
# Gradle 8.7 — pinned exactly.
#
# NOTE ON `distributionSha256Sum`: it is deliberately ABSENT. The correct value
# is a published checksum this repository's author could not obtain offline, and
# WP-24's standing rule on every security-adjacent path is NEVER MANUFACTURE
# EVIDENCE — a guessed checksum is worse than no checksum, because it looks like
# verification. Add the real value from https://gradle.org/release-checksums/
# when a network-connected reviewer can copy it rather than recall it.
#
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-8.7-bin.zip
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
