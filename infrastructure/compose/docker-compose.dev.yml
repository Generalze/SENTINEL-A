services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: sentinel-postgres
    environment:
      POSTGRES_DB: sentinel
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: sentinel
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sentinel']
      interval: 10s
      timeout: 5s
      retries: 5

  nats:
    image: nats:2.10-alpine
    container_name: sentinel-nats
    ports:
      - '127.0.0.1:4222:4222'
      - '127.0.0.1:8222:8222'
    volumes:
      - nats_data:/data
    command: ['-js', '-sd', '/data', '-m', '8222']
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '-', 'http://localhost:8222/healthz']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: sentinel-redis
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: sentinel-minio
    ports:
      - '127.0.0.1:9000:9000'
      - '127.0.0.1:9001:9001'
    environment:
      MINIO_ROOT_USER: sentinel
      MINIO_ROOT_PASSWORD: sentinel123
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  nats_data:
  redis_data:
  minio_data:
