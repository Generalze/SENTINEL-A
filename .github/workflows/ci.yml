name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://sentinel:sentinel@localhost:5433/sentinel
      NATS_URL: nats://localhost:4222
      REDIS_URL: redis://localhost:6379
      S3_ENDPOINT: http://localhost:9000
      S3_ACCESS_KEY: sentinel
      S3_SECRET_KEY: sentinel123
      S3_BUCKET: sentinel-dev
      S3_EVIDENCE_BUCKET: sentinel-evidence
      S3_REGION: us-east-1
      DEV_AUTH_ENABLED: 'true'
      # WP-29B — the Edge runtime's own identity/binding/endpoint/path keys.
      #
      # Declared EXPLICITLY rather than left to whatever the runner happens to
      # have, so a spec that boots the Edge config gets CI's values and not a
      # workstation's. They are identity and wiring only: nothing here affects
      # what Edge is willing to witness, which is hard-wired in
      # `services/edge-runtime/src/edge-runtime.constants.ts`.
      EDGE_ORGANISATION_ID: ci-org
      EDGE_ID: ci-edge
      EDGE_KEY_ID: ci-edge-key
      EDGE_KEY_VERSION: '1'
      EDGE_AUTHORISED_SITE_IDS: ci-site
      SENTINEL_CENTRAL_URL: http://localhost:3000
      EDGE_QUEUE_PATH: /tmp/sentinel-edge-queue
      # DELIBERATELY UNSET, and CI is where that matters most:
      #   EDGE_TRUSTED_TIME_VERIFICATION_KEYS / _KEYRING_VERSION
      #   EDGE_TRUSTED_TIME_SIGNER_KEY_ID / _SIGNING_KEY_FILE
      # Trust material and signing keys are a DEPLOYMENT act. A CI-shaped
      # default would be a key nobody chose, present in every branch, and the
      # fail-closed path — no keyring, no signing, no anchors — is precisely
      # what CI should be exercising by default.

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10.34.5'

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build contracts prerequisite
        run: pnpm --filter @sentinel/contracts build

      - name: Generate Prisma client prerequisite
        run: pnpm --filter @sentinel/core-api exec prisma generate --schema prisma/schema

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Start Proof-A live stack
        run: docker compose -f infrastructure/compose/docker-compose.dev.yml up -d --wait

      - name: Deploy database migrations
        run: pnpm --filter @sentinel/core-api exec prisma migrate deploy --schema prisma/schema

      - name: Lint
        run: pnpm -r lint

      # The scanner is installed EXPLICITLY. It is absent from the runner
      # image, and the previous inline gate treated that as "no matches found"
      # — reporting success while scanning nothing.
      - name: Install security scanner
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep
          rg --version

      # MC-01: the chain must build exactly the declared datamodel. This runs
      # immediately after the deploy above, against a service container that
      # started EMPTY — so it is a genuine from-zero proof, not an assertion
      # about a developer's database. It deliberately does not count
      # migrations; a chain of the right length can still build the wrong
      # schema.
      - name: Migration drift gate
        run: bash scripts/migration-drift-gate.sh

      - name: Security source gate
        run: bash scripts/security-source-gate.sh .

      - name: Test
        run: pnpm -r test

      - name: Proof-A regression
        env:
          PROOF_A_LIVE: '1'
        run: pnpm --filter @sentinel/core-api exec vitest run --config ../../vitest.proof-a.config.ts

      - name: Stop Proof-A live stack
        if: always()
        run: docker compose -f infrastructure/compose/docker-compose.dev.yml down -v

  # ===========================================================================
  # WP-30 — WAN-LOSS RECOVERY. A SEPARATE JOB, NOT A STEP IN `build`.
  #
  # WHY A JOB AND NOT A STEP.
  # -------------------------
  # The `build` job runs `pnpm -r test` and the Proof-A live suite against
  # `docker-compose.dev.yml`'s shared stack. This suite starts its OWN postgres,
  # nats, redis, minio, a containerised central, a WAN-link proxy and an Edge,
  # and then severs Docker networks and restarts services.
  #
  # Three reasons that cannot share a job with the ordinary sweep:
  #
  #   1. DATABASE CONTENTION. `MILESTONE-3-ROADMAP.md` already records
  #      "shared-Postgres live-suite contention" as engineering debt — twelve
  #      live suites against one database, one intermittent failure per full
  #      local run. A suite that restarts services would make that worse and
  #      much harder to attribute. This one runs its own postgres on its own
  #      port with its own volume, and touches nothing the other job uses.
  #   2. HOST NETWORK MUTATION. `docker network disconnect` is not scoped to a
  #      test process, and must not run alongside suites that assume a stable
  #      network.
  #   3. RUNTIME. Two image builds plus nine containers is minutes. The
  #      ordinary sweep is a fast feedback loop and stays one.
  #
  # A separate job gets its own runner, its own Docker daemon and its own
  # failure line in the checks list — so a WAN-loss failure is legible as a
  # WAN-loss failure rather than as "CI is red".
  #
  # `needs: build` is deliberate. This job is expensive, and there is no value
  # in severing networks for twenty minutes to discover the typecheck was
  # broken all along.
  # ===========================================================================
  wan-loss:
    name: WP-30 WAN-loss recovery
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10.34.5'

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      # The harness runs vitest on the RUNNER and drives containers from it, so
      # the runner needs the workspace installed. It also needs the generated
      # Prisma client: the harness seeds each scenario's own (org, site, user)
      # namespace directly, because every identity endpoint is guarded and
      # `DevAuthGuard` resolves its principal from the database — the first user
      # cannot be created through an API that requires a user to exist.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build contracts prerequisite
        run: pnpm --filter @sentinel/contracts build

      - name: Generate Prisma client prerequisite
        run: pnpm --filter @sentinel/core-api exec prisma generate --schema prisma/schema

      # `pnpm -r typecheck` and `pnpm -r lint` walk WORKSPACE MEMBERS, and
      # `tests/` is not one — so nothing under it is checked by any gate today,
      # `tests/integration/proof-a.test.ts` included. Vitest transpiles without
      # checking, so a type error in a harness surfaces as a runtime failure
      # inside a scenario and gets attributed to the system under test rather
      # than to the instrument measuring it. This harness is what Proof D's
      # credibility rests on; an instrument nobody checks is one nobody should
      # cite. Checked here rather than by making `tests/` a workspace package,
      # which would pull it into the `pnpm -r test` sweep it must stay out of.
      - name: Typecheck the WAN-loss harness
        run: pnpm exec tsc -p tests/wan-loss --noEmit

      - name: Lint the WAN-loss harness and the WAN-link proxy
        run: pnpm exec eslint tests/wan-loss infrastructure/wan-link

      # Explicit, not folded into the suite's globalSetup. `up --wait` blocks on
      # the containers' own healthchecks, so when this step returns, central is
      # answering. A failure here is a topology failure and reads as one.
      # THE THREE-PHASE START. THIS ORDER IS LOAD-BEARING.
      #
      # An earlier version of this job brought the whole topology up in one
      # `up -d --build --wait` and deployed migrations afterwards. It failed on
      # its first hosted run, and it failed for the right reason:
      #
      #   sentinel-wp30-central | Failed to start application:
      #   Invalid `prisma.constitutionPolicy.count()` invocation:
      #   The table `public.constitution_policies` does not exist ...
      #   dependency failed to start: container sentinel-wp30-central exited (1)
      #
      # Central does not come up degraded against an empty schema. Its
      # constitution module queries `constitution_policies` during bootstrap
      # and the process exits 1. That is the fail-closed behaviour this system
      # is supposed to have, and it must not be softened to make a pipeline
      # green. Migrations are therefore not something that can be applied to a
      # RUNNING stack; they are a PRECONDITION of it.
      #
      # `tests/wan-loss/harness/topology.ts` already documented and implemented
      # this exact sequence for local runs. This job contradicted it. It now
      # mirrors it, which is also the shape the `build` job above already has:
      # start the datastores, deploy the chain, start the services.
      #
      # The central image ships no Prisma CLI and does not migrate itself,
      # because a service that migrates on boot races the day two replicas
      # start together. Migration stays a discrete operator step with its own
      # authority.
      - name: Start WAN-loss datastores
        run: |
          docker compose -p sentinel-wp30 \
            -f infrastructure/compose/docker-compose.wan-loss.yml \
            up -d --wait postgres nats redis minio

      # WP-30 ADDS NO MIGRATION. This deploys the existing chain unchanged
      # against a database that started EMPTY - a from-zero deploy, and the
      # work package's migration delta is zero.
      - name: Deploy database migrations
        env:
          DATABASE_URL: postgresql://sentinel:sentinel@127.0.0.1:5453/sentinel
        run: pnpm --filter @sentinel/core-api exec prisma migrate deploy --schema prisma/schema

      # `--build` because the images are built from this repository, and a
      # harness that silently ran a stale central would be proving things about
      # code that is no longer in the tree.
      - name: Start WAN-loss services
        run: |
          docker compose -p sentinel-wp30 \
            -f infrastructure/compose/docker-compose.wan-loss.yml \
            up -d --build --wait

      - name: WAN-loss recovery suite
        env:
          WP30_WAN_LOSS_LIVE: '1'
        run: pnpm --filter @sentinel/core-api exec vitest run --config ../../vitest.wan-loss.config.ts

      # A failed run's logs are the only account of what the containers did,
      # and they are gone the moment the stack comes down. Dumped BEFORE the
      # teardown, and only on failure so a green run stays readable.
      - name: Topology logs on failure
        if: failure()
        run: |
          docker compose -p sentinel-wp30 \
            -f infrastructure/compose/docker-compose.wan-loss.yml logs --no-color --tail 400

      # `-v` is safe ONLY because `-p sentinel-wp30` is pinned. Without it
      # compose would derive the project name from the compose file's DIRECTORY
      # — the same name `docker-compose.dev.yml` derives — and this teardown
      # would delete the shared dev stack's volumes.
      - name: Stop WAN-loss topology
        if: always()
        run: |
          docker compose -p sentinel-wp30 \
            -f infrastructure/compose/docker-compose.wan-loss.yml down -v --remove-orphans
