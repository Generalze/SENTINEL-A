name: CI

# TI-04 - STACKED CANDIDATES MUST BE REACHABLE BY THIS WORKFLOW.
#
# `pull_request` used to carry `branches: [main]`, so this workflow fired only
# for pull requests whose BASE was `main`. Stacked candidates -- a work package
# opened against the branch below it rather than against `main` -- therefore
# received Android CI and nothing else, and the gap did not close on its own:
# when the parent landed, the stacked branch needed no new commit, so no
# `synchronize` fired, and there was no `workflow_dispatch` to fall back on.
#
# The practical consequence was that a candidate could sit MERGEABLE with a
# green checks list that had never run the repository's main suite against it.
# A missing required check is a safer failure than a false one, but neither is
# acceptable at a merge gate.
#
# `edited` is in the list on purpose: it is the event a BASE CHANGE raises, and
# a stacked PR whose parent has just merged has changed base without changing
# head. Without it, exactly the candidate most in need of re-qualification is
# the one that would not be re-qualified.
#
# `workflow_dispatch` exists so a qualification can be demanded rather than
# waited for.
#
# Android CI already had the correct broad trigger and is deliberately not
# touched here.
on:
  push:
    branches:
      - main

  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - edited

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://sentinel:sentinel@localhost:5433/sentinel
      NATS_URL: nats://localhost:4222
      REDIS_URL: redis://localhost:6379
      S3_ENDPOINT: http://localhost:9000
      S3_ACCESS_KEY: sentinel
      S3_SECRET_KEY: sentinel123
      S3_BUCKET: sentinel-dev
      S3_EVIDENCE_BUCKET: sentinel-evidence
      S3_REGION: us-east-1
      DEV_AUTH_ENABLED: 'true'
      # WP-29B — the Edge runtime's own identity/binding/endpoint/path keys.
      #
      # Declared EXPLICITLY rather than left to whatever the runner happens to
      # have, so a spec that boots the Edge config gets CI's values and not a
      # workstation's. They are identity and wiring only: nothing here affects
      # what Edge is willing to witness, which is hard-wired in
      # `services/edge-runtime/src/edge-runtime.constants.ts`.
      EDGE_ORGANISATION_ID: ci-org
      EDGE_ID: ci-edge
      EDGE_KEY_ID: ci-edge-key
      EDGE_KEY_VERSION: '1'
      EDGE_AUTHORISED_SITE_IDS: ci-site
      SENTINEL_CENTRAL_URL: http://localhost:3000
      EDGE_QUEUE_PATH: /tmp/sentinel-edge-queue
      # DELIBERATELY UNSET, and CI is where that matters most:
      #   EDGE_TRUSTED_TIME_VERIFICATION_KEYS / _KEYRING_VERSION
      #   EDGE_TRUSTED_TIME_SIGNER_KEY_ID / _SIGNING_KEY_FILE
      # Trust material and signing keys are a DEPLOYMENT act. A CI-shaped
      # default would be a key nobody chose, present in every branch, and the
      # fail-closed path — no keyring, no signing, no anchors — is precisely
      # what CI should be exercising by default.

    steps:
      # TI-04: AT THE EXACT CANDIDATE SHA, for the same reason Android CI
      # already does this. `actions/checkout` defaults on a `pull_request` to
      # the ephemeral MERGE commit of head into base -- a revision that exists
      # nowhere in the repository, that nobody is being asked to approve, and
      # that silently folds in whatever the base branch happens to contain at
      # the moment the job starts.
      #
      # That made this workflow qualify the PR INTEGRATION TREE while Android
      # CI qualified the CANDIDATE. Two required checks answering two different
      # questions, with only one of them the question a merge gate asks.
      #
      # Qualifications recorded before this change remain valid for what they
      # actually tested; they are simply not exact-head qualifications.
      - name: Check out the candidate revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      # The evidence line. A qualification that cannot say which revision it
      # qualified is not evidence, and this is the cheapest possible way to
      # make the answer readable in the log rather than inferred from it.
      - name: Report the revision under test
        run: |
          echo "workflow ref:  ${{ github.ref }}"
          echo "candidate SHA: $(git rev-parse HEAD)"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10.34.5'

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build contracts prerequisite
        run: pnpm --filter @sentinel/contracts build

      - name: Generate Prisma client prerequisite
        run: pnpm --filter @sentinel/core-api exec prisma generate --schema prisma/schema

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Start Proof-A live stack
        run: docker compose -f infrastructure/compose/docker-compose.dev.yml up -d --wait

      - name: Deploy database migrations
        run: pnpm --filter @sentinel/core-api exec prisma migrate deploy --schema prisma/schema

      - name: Lint
        run: pnpm -r lint

      # The scanner is installed EXPLICITLY. It is absent from the runner
      # image, and the previous inline gate treated that as "no matches found"
      # — reporting success while scanning nothing.
      - name: Install security scanner
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep
          rg --version

      # MC-01: the chain must build exactly the declared datamodel. This runs
      # immediately after the deploy above, against a service container that
      # started EMPTY — so it is a genuine from-zero proof, not an assertion
      # about a developer's database. It deliberately does not count
      # migrations; a chain of the right length can still build the wrong
      # schema.
      - name: Migration drift gate
        run: bash scripts/migration-drift-gate.sh

      - name: Security source gate
        run: bash scripts/security-source-gate.sh .

      - name: Test
        run: pnpm -r test

      - name: Proof-A regression
        env:
          PROOF_A_LIVE: '1'
        run: pnpm --filter @sentinel/core-api exec vitest run --config ../../vitest.proof-a.config.ts

      - name: Stop Proof-A live stack
        if: always()
        run: docker compose -f infrastructure/compose/docker-compose.dev.yml down -v

  # ===========================================================================
  # WP-29B — THE EDGE DEPLOYMENT ARTIFACT, QUALIFIED LIKE EVERYTHING ELSE.
  #
  # WHY THIS JOB EXISTS
  # -------------------
  # The Edge image is the thing that actually ships to a wiring closet, and
  # until now nothing in CI built it. The repository could therefore be green
  # while the artifact intended for the physical Edge did not build at all --
  # which is exactly what happened: the Dockerfile carried a `@types/node`
  # symlink workaround for a defect that had since been fixed properly in
  # `packages/contracts`, and no gate would have noticed if that workaround had
  # broken.
  #
  # A ONE-TIME SHELL EXPERIMENT PROVES A MOMENT; A JOB PROVES EVERY COMMIT.
  #
  # It is a separate job rather than a step in `build` because it needs no
  # database, no NATS and no Redis, and because an image-build failure should
  # be legible as an image-build failure rather than as "CI is red".
  # ===========================================================================
  edge-image:
    name: WP-29B Edge deployment artifact
    runs-on: ubuntu-latest

    steps:
      - name: Check out the candidate revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Report the revision under test
        run: echo "candidate SHA: $(git rev-parse HEAD)"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # 1. THE BUILD. From the repository ROOT, because the Dockerfile needs the
      #    workspace and the lockfile, not just one package directory.
      - name: Build the Edge image
        run: |
          docker build \
            -f services/edge-runtime/Dockerfile \
            --build-arg GIT_REVISION="$(git rev-parse HEAD)" \
            -t sentinel-edge-runtime:ci \
            .

      # 2. PROVENANCE. An image that cannot say which revision produced it is an
      #    image nobody can trace back to a review.
      - name: The image names the exact candidate revision
        run: |
          EXPECTED="$(git rev-parse HEAD)"
          ACTUAL="$(docker image inspect sentinel-edge-runtime:ci \
            --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')"
          echo "expected=${EXPECTED} actual=${ACTUAL}"
          test "${ACTUAL}" = "${EXPECTED}"

      # 3. NON-ROOT. A site appliance that runs as root turns any RCE into host
      #    compromise, and the queue's 0700 ownership assumes this uid.
      - name: The runtime user is non-root
        run: |
          USER_SPEC="$(docker image inspect sentinel-edge-runtime:ci --format '{{ .Config.User }}')"
          echo "image user: ${USER_SPEC}"
          test "${USER_SPEC}" = "10001:10001"

      # The build stage installs `@types/node` for contracts from its OWN
      # declaration; the runtime image must contain no typings at all. Asserting
      # the absence stops a future change from shipping the build tree.
      - name: No development typings are shipped
        run: |
          docker run --rm --entrypoint sh sentinel-edge-runtime:ci -c \
            'test ! -d /app/node_modules/@types' \
            || (echo "runtime image contains @types" >&2 && exit 1)

      # 4/5/6. IT BOOTS, IT IS HEALTHY, AND IT IS READY.
      #
      # EPHEMERAL KEY MATERIAL, GENERATED HERE. A private key committed so an
      # image can boot is a private key in the repository forever, and the fact
      # that it is "only for tests" is not a property anyone can verify later.
      - name: Boot the image and probe health and readiness
        run: |
          openssl ecparam -name prime256v1 -genkey -noout \
            | openssl pkcs8 -topk8 -nocrypt -out "${RUNNER_TEMP}/edge-signing-key.pem"
          chmod 0400 "${RUNNER_TEMP}/edge-signing-key.pem"

          docker volume create ci-edge-state
          docker run -d --name ci-edge \
            -e EDGE_ORGANISATION_ID=ci-org \
            -e EDGE_ID=ci-edge \
            -e EDGE_AUTHORISED_SITE_IDS=ci-site \
            -e EDGE_KEY_ID=ci-key \
            -e EDGE_KEY_VERSION=1 \
            -e SENTINEL_CENTRAL_URL=https://central.invalid \
            -e EDGE_SIGNING_KEY_FILE=/run/secrets/edge-signing-key.pem \
            -e LOG_LEVEL=error \
            -v ci-edge-state:/var/lib/sentinel-edge \
            -v "${RUNNER_TEMP}/edge-signing-key.pem:/run/secrets/edge-signing-key.pem:ro" \
            -p 13100:3100 \
            sentinel-edge-runtime:ci

          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:13100/health >/dev/null 2>&1; then break; fi
            sleep 2
          done

          echo "--- /health ---"
          curl -fsS http://127.0.0.1:13100/health
          echo "--- /health/ready ---"
          curl -fsS http://127.0.0.1:13100/health/ready

      # THE NEGATIVE HALF, AND THE MORE IMPORTANT ONE. An Edge that cannot write
      # its durable queue must not run: starting anyway would mean accepting
      # Field work it cannot persist, which is the one failure the whole offline
      # design exists to prevent. It must FAIL, not degrade.
      - name: An Edge with unwritable queue state refuses to run
        run: |
          docker run -d --name ci-edge-readonly \
            -e EDGE_ORGANISATION_ID=ci-org \
            -e EDGE_ID=ci-edge \
            -e EDGE_AUTHORISED_SITE_IDS=ci-site \
            -e EDGE_KEY_ID=ci-key \
            -e EDGE_KEY_VERSION=1 \
            -e SENTINEL_CENTRAL_URL=https://central.invalid \
            -e LOG_LEVEL=error \
            --tmpfs /var/lib/sentinel-edge:ro,size=1m \
            sentinel-edge-runtime:ci
          sleep 10
          RUNNING="$(docker inspect -f '{{ .State.Running }}' ci-edge-readonly)"
          echo "container running with read-only state: ${RUNNING}"
          test "${RUNNING}" = "false"

      # 7. NO PRODUCTION SECRET IS BAKED IN. The key above was mounted at RUN
      #    time into a tmpfs path and is not part of the image; this proves the
      #    image graph carries neither it nor any build-arg secret.
      - name: No secret material is baked into the image
        run: |
          if docker image inspect sentinel-edge-runtime:ci \
               --format '{{ json .Config.Env }}' | grep -Eiq '(PRIVATE KEY|SECRET|PASSWORD|TOKEN=)'; then
            echo "image environment carries secret-shaped values" >&2
            exit 1
          fi
          docker run --rm --entrypoint sh sentinel-edge-runtime:ci -c \
            'find / -xdev \( -name "*.pem" -o -name "*.key" \) 2>/dev/null | head -1' > /tmp/keys.txt
          if [ -s /tmp/keys.txt ]; then
            echo "key-shaped files in image:" >&2 && cat /tmp/keys.txt >&2 && exit 1
          fi
          echo "no key material in the image"

      - name: Container logs on failure
        if: failure()
        run: |
          docker logs ci-edge 2>&1 | tail -50 || true
          docker logs ci-edge-readonly 2>&1 | tail -20 || true

      - name: Tear down
        if: always()
        run: |
          docker rm -f ci-edge ci-edge-readonly 2>/dev/null || true
          docker volume rm -f ci-edge-state 2>/dev/null || true
